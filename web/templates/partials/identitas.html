<div class="kartu" x-data="{ n: '', get valid() { return this.n.length === 13 || this.n.length === 16 },
     tekan(d) { if (this.n.length < 16) this.n += d }, hapus() { this.n = this.n.slice(0, -1) } }">
  <h2 class="text-3xl font-bold">{{if eq .Mode "mjkn"}}Check-in Mobile JKN — Masukkan No. Kartu BPJS / NIK{{else}}Masukkan No. Kartu BPJS atau NIK{{end}}</h2>
  <p class="mt-1 text-xl text-slate-600">No. Kartu BPJS 13 digit atau NIK (KTP) 16 digit</p>
  {{if .Err}}<div class="mt-3 rounded-xl bg-red-100 px-5 py-3 text-2xl text-red-800">{{.Err}}</div>{{end}}

  <div class="mt-4 flex h-20 items-center justify-between rounded-2xl border-4 px-6"
       :class="valid ? 'border-emerald-600 bg-emerald-50' : 'border-slate-300 bg-white'">
    <span class="font-mono text-4xl tracking-[0.15em]" x-text="n || '—'"></span>
    <span class="text-xl text-slate-500" x-text="n.length + ' digit'"></span>
  </div>

  <form hx-post="/peserta" class="mt-4 grid grid-cols-3 gap-3">
    <input type="hidden" name="nomor" :value="n">
    <input type="hidden" name="mode" value="{{.Mode}}">
    <button type="button" hx-get="{{if eq .Mode "mjkn"}}/mjkn-checkin{{else}}/beranda{{end}}" class="tombol bg-slate-200 py-4 text-2xl active:bg-slate-300">← Kembali</button>
    <button type="submit" class="tombol col-span-2 py-4 text-3xl text-white"
            :disabled="!valid" :class="valid ? 'bg-emerald-700 active:bg-emerald-900' : 'bg-slate-400'">
      Lanjut <span class="text-xl font-normal" x-show="!valid">(isi 13 / 16 digit)</span>
    </button>
  </form>

  <div class="mt-4 grid grid-cols-3 gap-3">
    <template x-for="d in ['1','2','3','4','5','6','7','8','9']">
      <button type="button" class="tombol bg-white py-4 text-4xl ring-2 ring-slate-300 active:bg-slate-200" @click="tekan(d)" x-text="d"></button>
    </template>
    <button type="button" class="tombol bg-amber-100 py-4 text-2xl text-amber-900 active:bg-amber-200" @click="n=''">Hapus Semua</button>
    <button type="button" class="tombol bg-white py-4 text-4xl ring-2 ring-slate-300 active:bg-slate-200" @click="tekan('0')">0</button>
    <button type="button" class="tombol bg-amber-100 py-4 text-2xl text-amber-900 active:bg-amber-200" @click="hapus()">⌫ Hapus</button>
  </div>
</div>
